<meta charset="utf-8">
<title>Voice AI Dashboard Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>
      <div id="flowSel"></div>
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>
    </div>
    <aside id="panel">
      <div id="tabs">
        <button data-tab="what" class="on">What it does</button>
        <button data-tab="how">How it's built</button>
        <button data-tab="cond">Open questions</button>
      </div>
      <div id="body"></div>
    </aside>
  </div>
  <div id="hint">
    <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
  </div>
</div>

<script>
const GROUPS = [{"id":"build","title":"Building a bot"},{"id":"run","title":"Running it"},{"id":"reach","title":"Reaching people"},{"id":"watch","title":"Watching quality"},{"id":"gov","title":"Who may do what"}];
const NODES = [{"id":"UI","code":"D","name":"Dashboard","short":"DASHBOARD","group":"build","gx":1,"gy":1,"w":2.6,"d":2.6,"h":46,"kind":"screen","one":"The React app where a product manager does all of this without opening a terminal.","what":"The whole point of the platform. Someone who has never edited a Python file can create an agent, write what it should say, try it out loud, launch a calling campaign, and watch how it performs — from one browser tab.","how":"React + Vite, roughly 25,000 lines across <mark>~90 components and 29 views</mark>. Principal surfaces: <code>BotsView</code>, <code>BuilderView</code>, <code>FlowBuilderView</code>, <code>WorkflowBuilderView</code>, <code>CampaignsView</code>, <code>AnalyticsView</code>, <code>TranscriptsView</code>, <code>AdminView</code>. Supporting widgets carry real product weight: <code>CostEstimateStrip</code>, <code>BudgetCostWidget</code>, <code>CallDetailDrawer</code>, <code>CommandPalette</code>, <code>CreateWithAI</code>. Views ship with colocated <code>.test.tsx</code> files.","steps":[["Create","Pick a template or start blank via <code>CreateAgentPicker</code>."],["Configure","Prompt, voice, language, catalogs, functions — tabbed in <code>BotConfigTabs</code>."],["Estimate","Live ₹/min cost strip updates as the provider stack changes."],["Try","Browser test call, or scripted evals, without leaving the page."],["Publish","One button turns the draft into the next immutable version."]],"cond":["Views have colocated tests; roughly 90 components do not all. Which of the untested ones carry real logic rather than markup?",{"q":"Why build bespoke views rather than a generic admin framework?","r":"The product boundary is explicit — this is a prompt/settings/test/monitor tool, not a drag-and-drop builder — so the screens are shaped to that workflow rather than to a table schema (recorded in the onboarding brief)."}]},{"id":"CFG","code":"V","name":"Version store","short":"VERSIONS","group":"build","gx":5.6,"gy":1,"w":2.8,"d":2.8,"h":56,"kind":"gate","one":"Turns an edit into an immutable numbered version — and guarantees a call in progress never changes underneath itself.","what":"The single most important guarantee in the platform. A manager can publish a change mid-afternoon while eighty calls are live, and every one of those calls finishes on exactly the wording it started with. New versions affect only the next call. Rollback is picking an older number.","how":"<code>voicebot_platform/config_store.py</code>. <code>save_draft</code> → <code>publish_version</code> → <code>rollback_bot</code>, with <code>_next_version_number</code> assigning sequential numbers and <code>unpublish_version</code> as the reverse. <code>fetch_active_bot_config</code> is what the runtime calls once at room start; <code>build_runtime_snapshot</code> produces the frozen copy written into the transcript as <mark><code>config_snapshot</code></mark>. Collections: <code>bot</code>, <code>bot_versions</code>, <code>bot_templates</code>, <code>campaigns</code>.","steps":[["Draft","Edits accumulate on a mutable draft version."],["Publish","The draft becomes the next sequential immutable version and is marked active."],["Snapshot","A starting call resolves the active version once and freezes a copy into its own record."],["Roll back","Re-activate any earlier version by number — the history is never rewritten."]],"cond":[{"q":"What stops a publish from changing a live conversation?","r":"The call resolves config exactly once at room start and carries its own frozen copy for the rest of the call. Stated as a standing invariant in the onboarding brief: never break immutable per-call snapshots."},"`fetch_active_bot_config` runs on every call start with no cache, despite identical read patterns being cached elsewhere in the codebase. Deliberate, or an oversight at current volume?","Versions accumulate forever with no retention policy. At what point does a long-lived bot's version list become a problem?"]},{"id":"FLOW","code":"G","name":"Flow compiler","short":"FLOW COMPILE","group":"build","gx":5.6,"gy":-3.4,"w":2.4,"d":2.4,"h":30,"kind":"box","one":"Turns a drawn flowchart into written instructions the model is asked to follow — the deliberately cheap first half of a two-phase plan.","what":"A manager draws the call as boxes and arrows. Rather than build a machine that walks that graph, the first version simply describes the graph in words and appends it to the instructions. The model is told the steps; it can still wander. That was a known, accepted trade — and the reason is written down.","how":"<code>flow_compiler.py</code>. Walks <code>Flow/FlowNode/FlowEdge</code> and emits a structured text block appended to the system prompt, capped at <code>_MAX_NODES = 200</code> to stop a cyclic graph from blowing up the prompt. The source is explicit that this is <mark>not a deterministic interpreter</mark> — Phase B, tracking <code>current_node_id</code> as real call state with code deciding transitions, was deferred on purpose until real usage showed the text approach failing.","steps":[["Read the graph","Nodes and edges from the saved bot config."],["Describe","Each node becomes a numbered instruction — greeting, message, question, branch."],["Cap","200 nodes maximum, guarding against pathological or cyclic graphs."],["Append","The block joins the system prompt; the model is asked to follow it."]],"cond":[{"q":"Why ship guidance the model can ignore instead of a real interpreter?","r":"Same-day change, no pipeline architecture risk. The stated rule: only invest in Phase B once real usage shows the model does not follow this past a handful of nodes (recorded in the module docstring)."},"Has anyone measured where the model actually stops following — at five nodes, or fifty? That measurement is the trigger for Phase B."]},{"id":"WF","code":"W","name":"Workflow engine","short":"WORKFLOW","group":"build","gx":10.2,"gy":-3.4,"w":2.8,"d":2.8,"h":62,"kind":"tall","one":"The other half of the answer: a graph where every node is its own agent and every arrow is a function the model calls to move.","what":"Where the flow compiler describes a graph in words, this one actually runs it. Each state of the conversation is a separate agent with its own instructions, and moving between states is a real handoff inside the call framework — not a suggestion the model may ignore. A manager draws it; the platform executes it literally.","how":"<code>workflow_engine.py</code>. Exactly one <code>start</code> node seeds the opening line. Each <code>conversation</code> node becomes its own LiveKit <code>Agent</code>; each outgoing transition becomes a dynamically built <code>@function_tool</code>, and returning a new <code>Agent</code> from that tool makes the framework <mark>swap the live session onto it</mark>, firing <code>on_exit</code> and <code>on_enter</code> automatically. Function and condition nodes are transparent pass-throughs. The mechanism was confirmed by reading the framework's own <code>generation.py</code> and <code>agent_activity.py</code> — cited by file in the docstring rather than assumed.","steps":[["Resolve","A bot whose <code>bot_type == \"workflow\"</code> hands off here instead of running a fixed assistant."],["Build agents","One <code>Agent</code> per conversation node, each with its own instructions."],["Build tools","Each transition becomes a generated function tool with the edge's condition as its description."],["Hand off","The model calls a transition; the framework swaps the session onto the next agent."],["Extract","Post-call, a schema-driven extractor pulls structured answers back out."]],"cond":[{"q":"How was the handoff behaviour verified?","r":"By reading the framework source directly — <code>make_tool_output</code>, <code>agent_activity.py</code>, <code>AgentSession.update_agent</code> — and citing those files in the docstring, rather than relying on documentation."},"Two graph builders now exist — the flow compiler and this. Is the plan to converge them, or do they serve genuinely different bots?","What happens to a workflow graph with a cycle, given each node is a live agent?"]},{"id":"AI","code":"S","name":"Prompt assistant","short":"AI ASSIST","group":"build","gx":1,"gy":-3.4,"w":2.2,"d":2.2,"h":26,"kind":"box","one":"The sparkle button — generates or refines whichever piece of text the manager is currently editing.","what":"Writing a good agent prompt is genuinely hard, and it is the main thing standing between a product manager and a working bot. The same button appears next to every text area, but it knows which one it is next to and coaches differently for each.","how":"<code>backend/prompt_assist.py</code> — per-target instruction pairs, separate generate and refine framings for each. Targets are deliberately distinct kinds of writing: <mark>system prompt, closing line, and analysis-prompt override</mark>. Surfaced in the UI through <code>CreateWithAI</code> and the reused sparkles widget.","steps":[["Detect target","Which field the button sits beside."],["Pick framing","Generate from nothing, or refine what is already there."],["Return","Text drops straight into the editor for the manager to accept or edit."]],"cond":["Is generated prompt text marked anywhere as AI-authored, so a later reader knows what was hand-tuned?"]},{"id":"RES","code":"R","name":"Number resolver","short":"RESOLVER","group":"run","gx":10.2,"gy":1.4,"w":2.4,"d":2.4,"h":34,"kind":"box","one":"Answers one question when a phone rings: which of these bots is this number?","what":"A single runtime serves many agents. When a call comes in on a particular number, something has to decide whose personality answers. It is built to fail softly — if it cannot answer, the caller still gets a working bot rather than a dropped call.","how":"<code>agent_resolver.py</code>: dialed number → <code>agent_number_mapping</code> → bot → published version → config. Reads the <mark>platform database, which is a different database</mark> from the one transcripts are written to, so it holds its own read-only client. Every lookup returns <code>None</code> rather than raising — an unmapped number or an unreachable platform DB leaves the caller on the runtime's built-in persona instead of failing the call.","steps":[["Normalize","Clean the dialed number."],["Map","Look up the number → bot mapping."],["Resolve","Bot → its currently published version → its config."],["Fail soft","Any miss anywhere returns <code>None</code>; the call proceeds on the default persona."]],"cond":[{"q":"Why a separate Mongo client rather than reusing the runtime's?","r":"Different database entirely — the platform DB versus the call-transcript DB — so it owns its own read-only connection (stated in the module docstring)."},"A silent `None` means a misconfigured number is invisible until someone listens to a call on the wrong persona. Should a resolution miss raise an alert?"]},{"id":"TEST","code":"T","name":"Test call","short":"TEST CALL","group":"run","gx":14.6,"gy":1.4,"w":2.4,"d":2.4,"h":32,"kind":"screen","one":"Talk to the draft in your browser, before it ever reaches a real phone.","what":"The shortest possible loop between writing a prompt and hearing it. No phone, no deploy, no scheduling — click, speak, listen. This is what makes the dashboard usable by someone who cannot read the runtime code.","how":"<code>voicebot_platform/livekit_sessions.py</code> plus <code>backend/routers/testcall.py</code>, creating and closing a WebRTC room on demand. Driven from <code>TestCallPanel</code>, with <code>TestLLMPanel</code> for a text-only turn. Test calls run under a dedicated <mark>separate worker name</mark> on a staging port so they can never be mistaken for production traffic. Recordings attach back to the session via <code>attach_test_recording</code>.","steps":[["Create","A test room is created for this draft."],["Join","The browser joins over WebRTC; the test worker joins as the agent."],["Converse","The draft config runs — unpublished, affecting nothing live."],["Close","The room is torn down and the recording attached for playback."]],"cond":["Test rooms are created on demand — is there a reaper for sessions a browser abandoned without closing?"]},{"id":"EV","code":"E","name":"Evals","short":"EVALS","group":"run","gx":14.6,"gy":-3,"w":2.2,"d":2.2,"h":28,"kind":"cards","one":"Scripted conversations replayed against a prompt, so a change can be checked without dialling anyone.","what":"A test call tells you how one conversation went. Evals tell you whether an edit made things better or worse across a set of situations you care about — the awkward caller, the one who changes their mind, the one who answers a different question than the one asked.","how":"<code>backend/evals.py</code> — <code>run_scenario</code> and <code>run_evals</code> drive a set of <code>EvalScenario</code> objects against a candidate system prompt using a configurable model (<code>EVALS_GEMINI_MODEL</code>). Surfaced through <code>EvalsPanel</code> next to the prompt being edited.","steps":[["Define","Scenarios are authored alongside the bot."],["Run","Each is played against the candidate prompt."],["Compare","Results surface in the builder, beside the text that produced them."]],"cond":["Are eval results stored per version, so a manager can see that version 12 scored worse than version 11?","Two endpoints only. Is this the smallest useful version of evals, or was it descoped?"]},{"id":"CAMP","code":"C","name":"Campaign engine","short":"CAMPAIGNS","group":"reach","gx":5.6,"gy":6.4,"w":2.8,"d":2.8,"h":48,"kind":"gate","one":"A lead list becomes a queue of call jobs, handed out one at a time under a lease.","what":"Upload a spreadsheet of people to call, and the platform turns it into work. The careful part is what happens when something goes wrong halfway: a job that was handed out but never finished must come back, and a job that keeps failing must stop retrying and become visible rather than looping silently forever.","how":"<code>backend/campaign_execution.py</code>. <code>enqueue_pending_leads</code> → <code>claim_next_job</code> → <code>mark_job_dialing</code> → <code>complete_job</code>. <code>reclaim_stale_dialing</code> returns jobs stuck past a timeout (default 45 min). <code>revert_to_queued_or_fail</code> enforces <code>MAX_PUSH_ATTEMPTS = 5</code> so a permanently-failing push lands in a visible <mark><code>push_failed</code></mark> state instead of retrying invisibly. <code>mint_push_ref</code> gives each push an idempotency reference; <code>derive_campaign_status</code> computes campaign state from its jobs rather than storing it.","steps":[["Enqueue","Uploaded leads become queued call jobs."],["Claim","A worker leases the next job for one campaign."],["Push","The lead goes to the external dialer with a minted reference."],["Await","The job sits in <code>dialing</code> until a webhook reports back."],["Reclaim","Anything stuck past the timeout returns to the queue."],["Give up visibly","Five failed pushes and the job becomes <code>push_failed</code>, where a person can see it."]],"cond":[{"q":"Why cap push attempts at all?","r":"Without a cap a bad dialer config retries every tick forever with the failure invisible to a PM — the cap forces it into a visible failed state (recorded in the worker config)."},"Campaign status is derived from job counts on read rather than stored. At what campaign size does that become expensive?","Per-campaign claim loops mean N campaigns is N loops. What is the practical ceiling?"]},{"id":"DIAL","code":"P","name":"Dialer worker","short":"DIALER","group":"reach","gx":1,"gy":6.4,"w":2.6,"d":2.6,"h":44,"kind":"job","one":"The loop that actually feeds people to the phone system — and the one piece here that makes a real phone ring.","what":"Everything else in the platform is safe to run. This one is not: pointing it at a live campaign causes real numbers to be dialled. That warning is written at the top of the file, in the source, where someone about to run it will see it.","how":"<code>campaign_dialer_worker/worker.py</code>. Polls every <code>POLL_INTERVAL_SEC = 30</code>, up to <code>BATCH_LIMIT_PER_CAMPAIGN = 10</code> per campaign, with one claim loop per active campaign. Pushes through <code>dialer_client.push_lead_to_dialer</code> to the external dialer API. Shares <code>callback_worker</code>'s shape — claim/lease loop, rotating log, graceful shutdown — but adapted from one global queue to per-campaign claiming. Its docstring carries an explicit <mark>⚠️ warning that running it dials real phone numbers</mark>.","steps":[["Poll","Find active campaigns."],["Reclaim","Return anything stuck in <code>dialing</code> past the timeout."],["Claim","Lease up to ten jobs for each campaign."],["Push","Send each lead to the external dialer."],["Mark","Job moves to <code>dialing</code>; the webhook closes the loop."]],"cond":["The only guard against dialling real people in testing is a comment. Should a dry-run mode be enforced in code?","Per-campaign loops within a single process — is there a lock preventing two worker instances double-dialling the same lead?"]},{"id":"HOOK","code":"H","name":"Dialer webhooks","short":"WEBHOOKS","group":"reach","gx":10.2,"gy":6.4,"w":2.2,"d":2.2,"h":28,"kind":"box","one":"How the phone system tells the platform a call is over.","what":"The dialer is somebody else's system, and it works asynchronously — it takes a lead, dials it whenever it can, and reports back later. This is the door it knocks on, and the moment a queued job finally becomes a completed one.","how":"<code>backend/routers/dialer_webhooks.py</code>, keyed per service: <code>POST /api/dialer-webhooks/{service_id}/call-complete</code>. Resolves the job by phone via <code>find_in_progress_job_by_phone</code> and calls <code>complete_job</code>, closing the lease the dialer worker opened.","steps":[["Receive","The dialer posts a completion for one call."],["Match","Find the in-progress job for that number."],["Complete","Close the job and record the outcome."]],"cond":["Jobs are matched by phone number. What happens if the same number is live in two campaigns at once?","Is the webhook authenticated, or does it trust the service id in the path?"]},{"id":"AN","code":"A","name":"Analytics","short":"ANALYTICS","group":"watch","gx":5.6,"gy":11.4,"w":2.8,"d":2.8,"h":40,"kind":"store","one":"One surface answering the only question that matters: is this bot working?","what":"Outcomes by category, cost per call, how many conversations reached their goal, which ones dropped and where. Built for a manager deciding whether to keep a prompt change, not for an engineer reading a log file.","how":"<code>backend/routers/analytics.py</code>, <code>backend/metrics.py</code>, and <code>config_store.get_outcome_analytics</code>, filtered by bot, campaign and date range. <code>metrics.py</code> pins one shared definition of which call states count as <mark>not failed</mark>, used by both the dashboard's task-completion rate and per-bot metrics, so the two surfaces cannot disagree. CSV export via <code>export_transcripts_csv</code>.","steps":[["Filter","By bot, campaign, and window."],["Aggregate","Outcomes, completion rate, cost, volume."],["Compare","Across versions and campaigns."],["Export","CSV for anyone who wants it in a spreadsheet."]],"cond":["Some aggregation is done in Python over fetched documents rather than pushed into the database. At what volume does that stop being fine?","Can a manager see analytics split by *version*, to tell whether their prompt edit actually helped?"]},{"id":"TR","code":"X","name":"Transcripts","short":"TRANSCRIPTS","group":"watch","gx":10.2,"gy":11.4,"w":2.6,"d":2.6,"h":26,"kind":"store","one":"Every conversation, searchable, with the audio and the exact config that produced it.","what":"When a call goes wrong, this is where someone goes. Not just what was said, but which version was running, what it cost, how long each reply took — and the recording, so you can hear the thing rather than read it.","how":"<code>config_store.search_transcripts</code> over <code>call_transcripts</code>, plus <code>call_events</code> for the operational timeline. Each record carries its <code>config_snapshot</code>. The realtime transcript captures what happened live, but <mark>recording-derived post-call speech-to-text is the final source of truth</mark> when available — the two are kept distinct rather than merged. Surfaced through <code>TranscriptsView</code>, <code>CallDetailDrawer</code> and <code>AudioPlayer</code>.","steps":[["Search","By bot, campaign, outcome, date, or text."],["Open","Turn-by-turn view with latency and cost."],["Listen","Recording playback beside the text."],["Inspect","The exact config snapshot that produced this call."]],"cond":["Two transcript sources with different reliability. Does the UI make clear which one a reader is looking at?","No retention policy is visible. Recordings plus transcripts grow without bound — what is the plan?"]},{"id":"ALERT","code":"L","name":"Alert worker","short":"ALERTS","group":"watch","gx":14.6,"gy":11.4,"w":2.4,"d":2.4,"h":38,"kind":"job","one":"Checks every minute whether anything has gone wrong, and opens an incident when it has.","what":"Nobody watches a dashboard at 2am. A manager writes a rule — if the drop rate goes above this, tell me — and the platform watches instead, opening a tracked incident rather than firing a notification into the void.","how":"<code>alert_worker/worker.py</code>, polling every <code>POLL_INTERVAL_SEC = 60</code> — a cadence chosen to match what a comparable commercial product documents. Evaluates <code>alert_rules</code> against transcripts and metrics and writes <code>alert_incidents</code>. Imports <code>backend.db</code>, <code>backend.auth</code> and <code>backend.metrics</code> directly so there is <mark>one definition of each metric</mark> rather than a second copy that could drift. Surfaced in <code>AlertsPanel</code>. Related: <code>get_quality_alerts</code> flags outcome-rate drops on a rolling window.","steps":[["Tick","Every 60 seconds."],["Evaluate","Each rule against the current window."],["Open","A breach creates a tracked incident, not just a message."],["Notify","Route to the people the rule names."]],"cond":["Incidents are opened — is anything closing them, or does a resolved problem stay open until someone clicks?","The 60-second cadence was copied from a competitor's documented behaviour. Has it been checked against how fast these calls actually degrade?"]},{"id":"COST","code":"₹","name":"Pricing engine","short":"PRICING","group":"watch","gx":1,"gy":11.4,"w":2.4,"d":2.4,"h":30,"kind":"cards","one":"Prices every call in rupees, and can pick a cheaper provider stack to hold a budget.","what":"Voice AI cost is not obvious — the same conversation can cost a few paise or a few rupees depending on which speech, language and voice services it runs on. The platform makes that visible while a manager is still editing, and can choose a cheaper combination to fit a stated budget.","how":"<code>backend/pricing.py</code>, deliberately <mark>pure arithmetic with no I/O and no database</mark> so the estimate a PM sees and the cost a campaign is charged come from the same code and cannot drift. Per-minute ₹ rates across speech-to-text, language models, text-to-speech and telephony — a <code>65×</code> spread between the cheapest and most expensive voice alone. Self-hosted voice is labelled in the source as a compute-amortization estimate rather than a metered rate. Several catalog entries are priced but explicitly not wired to a live client. Surfaced via <code>CostEstimateStrip</code>, <code>BudgetCostWidget</code>, <code>CostBreakdownPopover</code>.","steps":[["Rate","Look up ₹/min for the chosen stack."],["Estimate","Project cost per call and per campaign."],["Route","Given a budget, select a stack that fits."],["Show","Live in the builder, before anything is published."]],"cond":[{"q":"Why keep pricing free of any I/O?","r":"So it is plain unit-testable arithmetic and cannot drift between the API endpoint, the campaign estimate, and any future caller (stated in the module docstring)."},"Rates are hard-coded constants. Who updates them when a vendor changes price, and how would anyone notice they had gone stale?","Catalog-only providers appear in estimates but cannot be dialled. Does the UI make that distinction visible to a PM comparing options?"]},{"id":"AUTH","code":"U","name":"Auth and roles","short":"AUTH · RBAC","group":"gov","gx":14.6,"gy":6.4,"w":2.4,"d":2.4,"h":34,"kind":"gate","one":"Company single sign-on, one seeded admin, and everyone else a regular user until promoted.","what":"People log in with their existing work account rather than a new password. The interesting part is a bug that got fixed properly: for a while, every new login quietly became an administrator.","how":"<code>backend/sso.py</code> — OAuth2 with PKCE against the company identity provider — plus <code>backend/auth.py</code> for tokens and roles. <code>issue_token_for_sso_profile</code> grants <code>admin</code> only to the single seeded address; every other login defaults to <code>user</code>. Written with <mark><code>$setOnInsert</code></mark> so a role an admin grants later is never clobbered on next login. The earlier workaround demoted admins on a schedule, which silently reverted deliberate grants; that was replaced by fixing the default at its source.","steps":[["Sign in","OAuth2 + PKCE against company SSO."],["Provision","First login creates the account — as <code>user</code>, unless it is the seeded admin."],["Preserve","<code>$setOnInsert</code> keeps later role grants intact across logins."],["Authorize","Role gates the destructive routes."]],"cond":[{"q":"Why not keep the scheduled demotion as a safety net?","r":"Because it was a repeating sweep, not a one-time cleanup, and it silently reverted any admin role a real admin had granted. Fixing the default at its source removed the need for it."},"Two roles only — admin and user. Does a PM who should not launch campaigns need a third?"]},{"id":"AUD","code":"O","name":"Audit log","short":"AUDIT","group":"gov","gx":10.2,"gy":16.2,"w":2.2,"d":2.2,"h":24,"kind":"store","one":"Who changed what, and when — because published versions affect real phone calls to real people.","what":"A prompt edit here is not a code change on a branch; it changes what a stranger hears on the phone tomorrow morning. The trail of who published what matters, and it is visible in the dashboard rather than buried in a server log.","how":"<code>backend/audit.py</code> with <code>backend/routers/audit.py</code>, surfaced as <code>AuditLogView</code>. Every mutating call in <code>config_store</code> carries a <code>user</code> argument — <code>save_draft</code>, <code>publish_version</code>, <code>rollback_bot</code>, <code>delete_bot</code>, <code>set_campaign_status</code> — so <mark>authorship is a parameter, not an afterthought</mark>.","steps":[["Attribute","Every mutation carries the acting user."],["Record","Action, target, timestamp."],["Review","Filterable in the dashboard."]],"cond":["Does the audit entry capture what changed, or only that something did?","Is the log append-only at the database level, or only by convention?"]}];

const CH = [{"id":"why","title":"The problem","reveal":["UI","CFG"],"lede":"Changing what a voice bot said used to mean editing a file on a production server.","story":"<p>That is the whole reason this exists. A product manager who knew exactly what the bot should say had to ask an engineer, who had to edit Python, on a machine also running live calls.</p><p>The dashboard replaced the file edit. The version store made it <mark>safe to do while calls are in progress</mark> — which is the harder half of the problem.</p>","flow":[["UI","CFG","save draft",{"bot_id":"bot_7c1","version":"draft"}]]},{"id":"safe","title":"Publishing without breaking a live call","reveal":[],"lede":"Eighty calls are in progress. You publish. Nothing about those eighty calls changes.","story":"<p>A call resolves its configuration exactly once, when the room opens, and carries a frozen copy for the rest of its life. Publishing writes a new numbered version that only the <em>next</em> call will see.</p><p>The onboarding brief states it as a standing invariant: <mark>never break immutable per-call snapshots</mark>. Rollback is then trivial — it is just picking an older number.</p>","flow":[["CFG","UI","publish v12 while calls are live",{"version":12}],["UI","CFG","next call only",{"affects":"future calls"}]]},{"id":"draw","title":"Drawing the conversation","reveal":["FLOW","WF"],"lede":"Two answers to \"let a manager draw the call as boxes and arrows\" — one cheap, one real.","story":"<p>The flow compiler describes the drawn graph in words and appends it to the instructions. The model is asked to follow it and may wander. That limitation was <mark>accepted deliberately and written down</mark> — ship the same-day version, and only build the real interpreter once usage proves the model does not follow it.</p><p>The workflow engine is the real one. Each node becomes its own agent, each arrow becomes a function the model calls, and the framework genuinely swaps the live session between them. That behaviour was confirmed by reading the framework's own source and citing the files.</p>","flow":[["FLOW","WF","same graph, two treatments",{"nodes":9,"phase":"A vs live handoff"}]]},{"id":"help","title":"Helping the manager write","reveal":["AI"],"lede":"The hardest part of building an agent is writing what it should say.","story":"<p>The same sparkle button sits beside every text area, but it knows which one it is next to — a system prompt, a closing line, and an analysis instruction are <mark>three different kinds of writing</mark>, and each gets its own coaching.</p>","flow":[["UI","AI","refine this prompt",{"target":"system_prompt"}],["AI","UI","suggested text",{"chars":1840}]]},{"id":"try","title":"Trying it before anyone hears it","reveal":["TEST","EV"],"lede":"Speak to the draft in your browser, or replay a set of scripted callers against it.","story":"<p>The test call is the shortest loop the platform has — click, talk, listen, with no phone and no deploy. It runs under a separate worker name on a staging port so it can never be confused with production traffic.</p><p>Evals answer the other question: not \"how did this one call go\" but <mark>\"did my edit make things better or worse\"</mark> across the situations that actually matter.</p>","flow":[["UI","EV","run scenarios",{"scenarios":6}],["EV","UI","results",{"passed":5,"failed":1}],["UI","TEST","browser test call",{"worker":"test-only"}]]},{"id":"answer","title":"Which bot answers this number?","reveal":["RES"],"lede":"One runtime, many agents — and a lookup built to fail softly.","story":"<p>A dialed number maps to a bot, which maps to its published version, which is the config the call runs on. It reads a <em>different database</em> from the one transcripts are written to, so it holds its own read-only connection.</p><p>Every lookup returns nothing rather than raising. An unmapped number or an unreachable platform leaves the caller on the runtime's built-in persona — <mark>a wrong personality beats a dropped call</mark>.</p>","flow":[["RES","CFG","which bot is this number?",{"dialed":"+91…4471"}],["CFG","RES","active version",{"version":12}]]},{"id":"reach","title":"Calling four thousand people","reveal":["CAMP","DIAL","HOOK"],"lede":"A spreadsheet becomes a queue, handed out one lease at a time.","story":"<p>The careful parts are the failure paths. A job handed out but never finished is reclaimed after 45 minutes. A push that keeps failing stops after five attempts and lands in a <mark>visible failed state</mark> — because the alternative is retrying forever with nobody able to see it.</p><p>The dialer itself is somebody else's system and works asynchronously, so a webhook is how a call finally reports back. And the worker that drives it carries a warning in its own source: run this and real phones ring.</p>","flow":[["UI","CAMP","upload leads",{"rows":4200}],["CAMP","DIAL","queued jobs",{"batch":10}],["DIAL","HOOK","pushed to dialer",{"state":"dialing"}],["HOOK","CAMP","call complete",{"state":"completed"}]]},{"id":"money","title":"What a conversation costs","reveal":["COST"],"lede":"The same call can cost a few paise or a few rupees, depending entirely on the stack.","story":"<p>There is a <mark>65× spread</mark> between the cheapest and most expensive voice alone. So cost is shown live in the builder, while the manager is still choosing — and given a budget, the platform can pick a stack that fits.</p><p>The pricing module is deliberately pure arithmetic with no database access, so the number quoted in the builder and the number charged to a campaign are computed by the same code and cannot drift apart.</p>","flow":[["UI","COST","estimate",{"llm":"gemini_2_5_flash","tts":"indic_f5"}],["COST","UI","₹/min",{"total":0.59}]]},{"id":"watch","title":"Is it working?","reveal":["AN","TR"],"lede":"Outcomes, cost and completion on one surface — and every conversation behind it.","story":"<p>Analytics is built for the person deciding whether to keep a prompt change, not for an engineer reading logs. One shared definition of \"this call did not fail\" is pinned in a single module so the dashboard and the per-bot page <mark>cannot disagree with each other</mark>.</p><p>Behind it sits every transcript, with its audio and the exact frozen config that produced it. Two transcript sources are kept deliberately distinct: the live one shows real-time behaviour, but recording-derived post-call transcription is the final word.</p>","flow":[["TR","AN","roll into analytics",{"outcome":"qualified","cost_inr":1.42}],["UI","TR","open the failing calls",{"filter":"outcome=dropped"}]]},{"id":"alarm","title":"Nobody watches at 2am","reveal":["ALERT"],"lede":"A rule watches instead, and opens a tracked incident rather than firing a message into the void.","story":"<p>Every sixty seconds, each rule is evaluated against the current window. A breach becomes an <mark>incident someone owns</mark>, not a notification someone missed.</p><p>The worker imports the metric definitions rather than reimplementing them, so an alert threshold and the dashboard number it refers to always mean the same thing.</p>","flow":[["ALERT","TR","evaluate rule window",{"rule":"drop_rate > 30%"}],["ALERT","UI","incident opened",{"severity":"high"}]]},{"id":"who","title":"Who may do what","reveal":["AUTH","AUD"],"lede":"Publishing here changes what a stranger hears on the phone tomorrow. The trail matters.","story":"<p>People sign in with their existing work account. For a while, every new login quietly became an administrator — and the first fix was a scheduled sweep demoting them, which <mark>silently reverted deliberate grants</mark>. It was replaced by fixing the default at its source.</p><p>Every mutating call carries the acting user as an argument, so authorship is a parameter rather than an afterthought.</p>","flow":[["UI","AUTH","sso login",{"provider":"company IAM","flow":"OAuth2 + PKCE"}],["CFG","AUD","who published what",{"action":"publish","version":12}]]},{"id":"all","title":"The whole platform","reveal":[],"lede":"Everything at once, for free exploration.","story":"<p>Choose which flow runs from the picker at bottom left. Hover anything to read it; click to pin it; <code>→</code> goes inside a component to see its steps; click a moving dot to inspect what it carries.</p><p>The <mark>Open questions</mark> tab lists every question raised here by ID — the ones with answers carry the reasoning behind them.</p>","flow":null}];
const HOW_HTML = "<div class=\"eyebrow\">voice-ai-dashboard · anonymized case study</div>\n<h1 class=\"t\">How it's built</h1>\n<div class=\"sub\">a no-code platform for people who do not write code</div>\n\n<h3 class=\"sec\">The shape in one line</h3>\n<p>A FastAPI backend with 21 routers, a React dashboard of ~90 components, and three independent workers — one dialing, one alerting, one analysing calls after they end — over MongoDB, with LiveKit behind the browser test calls and the workflow engine.</p>\n\n<h3 class=\"sec\">The product boundary</h3>\n<p>Written into the onboarding brief so it stops being re-litigated: this is <mark>not a general drag-and-drop bot builder</mark>. It is a prompt, settings, catalog, test-call, transcript, observability and dialing-strategy platform. Campaigns are authored here and executed by an external dialer. The runtime is LiveKit Agents native.</p>\n\n<h3 class=\"sec\">What the platform gives us</h3>\n<p>FastAPI provides routing, validation and dependency-injected auth. LiveKit provides WebRTC rooms for browser test calls and the agent-handoff machinery the workflow engine builds on. MongoDB is the document store. React Flow provides the graph canvas.</p>\n\n<h3 class=\"sec\">What we own</h3>\n<p>The draft/publish/rollback lifecycle and its immutable per-call snapshot guarantee. The compiler that turns a drawn graph into live agent handoffs. The campaign claim/lease engine with stale reclaim and a retry cap. The ₹ pricing model and budget-based stack routing. The evals harness, the alert-rule engine, RBAC and audit, and the entire dashboard.</p>\n\n<h3 class=\"sec\">The invariant everything rests on</h3>\n<p>A live call resolves its configuration exactly once, at room start, and copies it into its own transcript as <code>config_snapshot</code>. Publishing a new version affects only calls that begin afterwards. Stated in the onboarding brief as a rule not to break, and it is what makes publishing during business hours a non-event.</p>\n\n<h3 class=\"sec\">Scope of this atlas</h3>\n<p>This covers the platform — the dashboard, API, and the campaign and alert workers. The voice runtime it manages (the telephony dispatcher, conversation pipelines, and post-call analysis) is mapped separately in the companion <code>voice-ai-atlas</code>. Company name and internal endpoints are placeholders; everything structural is as it ran.</p>\n\n<h3 class=\"sec\">Filesystem</h3>\n<pre>backend/\n  main.py                  # FastAPI app\n  routers/                 # 21 routers — bots(26 endpoints), campaigns(19),\n                           #   auth(9), pricing(5), alerts(5), analytics,\n                           #   evals, testcall, transcripts, dialer_webhooks…\n  campaign_execution.py    # claim / lease / complete for call jobs\n  pricing.py               # pure ₹ arithmetic + budget stack routing\n  evals.py                 # scripted scenario runner\n  post_call_analysis.py    # schema-driven extraction for workflow bots\n  metrics.py               # one shared definition of \"did not fail\"\n  auth.py, sso.py, audit.py\nvoicebot_platform/\n  config_store.py          # bots, draft/published versions, rollback\n  livekit_sessions.py      # browser test-call rooms\n  observability.py         # trace + call-event helpers\n  option_catalogs.py, phrase_library.py, outcome_catalog.py\nworkflow_engine.py         # visual graph -> live agent handoffs\nflow_compiler.py           # graph -> prompt text (Phase A)\nagent_resolver.py          # inbound number -> bot -> published version\ncampaign_dialer_worker/    # feeds leads to the external dialer  (⚠ dials real numbers)\nalert_worker/              # evaluates alert rules, opens incidents\nfrontend/src/\n  views/                   # 29 views incl. Builder, FlowBuilder,\n                           #   WorkflowBuilder, Campaigns, Analytics\n  components/              # ~90 components</pre>\n\n<h3 class=\"sec\">Data stores</h3>\n<pre>platform DB       bots · bot_versions · bot_templates · campaigns\n                  campaign_leads · agent_number_mapping\n                  alert_rules · alert_incidents · users · audit\ntranscript DB     call_transcripts (with config_snapshot) · call_events\n                  — a SEPARATE database, reached by its own client</pre>";
const DECISIONS_HTML = "<li><b>Config lifecycle.</b> Draft → immutable numbered version → publish. A live call fetches the active version once at room start and copies it into its own transcript as <code>config_snapshot</code>, so publishing never changes a conversation already in progress</li><li><b>Product scope.</b> Explicitly *not* a general drag-and-drop bot builder. It is a prompt, settings, catalog, test-call, transcript, observability and dialing platform — the boundary is written into the onboarding brief so it stops being re-litigated</li><li><b>Flow builder.</b> Phase A compiles the visual graph into prompt text the model is asked to follow; Phase B (a real interpreter with code-decided transitions) deliberately deferred until usage proves the text approach fails</li><li><b>Workflow bots.</b> Each conversation node becomes its own LiveKit <code>Agent</code>; each outgoing edge becomes a generated <code>@function_tool</code> whose return value triggers a real framework-level agent handoff — verified against the framework source, not assumed</li><li><b>Dialing.</b> Campaigns are authored here but executed by the external dialer. The platform owns the queue, the lease and the retry cap; the dialer owns the phone line</li><li><b>Cost.</b> <code>pricing.py</code> is pure arithmetic with no I/O, so the estimate shown to a PM and the cost charged to a campaign are computed by the same code and cannot drift</li><li><b>Database split.</b> The platform DB and the call-transcript DB are separate databases with separate clients. <code>agent_resolver</code> reads the platform DB read-only and returns <code>None</code> on any failure, so an unreachable platform never fails a live call</li><li><b>Roles.</b> Exactly one seeded admin; every other SSO login is a regular user. Fixed at the source after a bug where any new login defaulted to admin — <code>$setOnInsert</code> so a role granted later is never clobbered</li><li><b>Transcript truth.</b> The realtime transcript shows what happened during the call, but recording-derived post-call speech-to-text is the final source of truth when available</li><li><b>Server safety.</b> Live bot processes and the staging dashboard share a server. Ports, checkout paths and a read-only-checks-first rule are written into the onboarding brief rather than held as tribal knowledge</li>";

/* ---------------- ISO ---------------- */
const TW=72, TH=36;
function P(gx,gy,z=0){ return [(gx-gy)*TW/2, (gx+gy)*TH/2 - z]; }
function pts(a){ return a.map(p=>p.join(',')).join(' '); }
const byId = Object.fromEntries(NODES.map(n=>[n.id,n]));
const center = n => [n.gx+n.w/2, n.gy+n.d/2];
const NS='http://www.w3.org/2000/svg';
const el=(t,a={},...kids)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);kids.forEach(k=>e.appendChild(k));return e;};
const qOpen=n=>(n.cond||[]).filter(c=>!c.r&&!c.to).length; const qHtml=list=>`<ul class="q">${list.map(c=>c.r?`<li class="res"><span>${c.q}</span><div class="ans">✓ ${c.r}</div></li>`:c.to?`<li class="to"><span>${c.q}</span><div class="ans">→ ${c.to}</div></li>`:`<li>${c.q}</li>`).join('')}</ul>`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---------------- STATE ---------------- */
const S = { ch:0, view:'world', inside:null, selected:null, hover:null, tab:'what', playing:true, tx:0, ty:0, k:1, packets:[], selPacket:null, hoverPacket:null, flowSel:(typeof FLOWS!=='undefined'&&FLOWS[0]?FLOWS[0].id:'turn'), maxCh:0 };
const svg=document.getElementById('svg'), world=document.getElementById('world'), tip=document.getElementById('tip'), body=document.getElementById('body');
let sceneNodes=[], sceneHops=[];
const revealedIds=()=>{ if(S.ch>=CH.length-1) return NODES.map(n=>n.id); const s=new Set(); for(let i=0;i<=S.ch;i++) CH[i].reveal.forEach(id=>s.add(id)); return [...s]; };
const isNew=id=>S.ch<CH.length-1 && CH[S.ch].reveal.includes(id);
const revealChapterOf=id=>{ for(let i=0;i<CH.length-1;i++) if(CH[i].reveal.includes(id)) return i; return CH.length-1; };

/* ---------------- SCENES ---------------- */
function buildWorldScene(){
  const ids=new Set(revealedIds()); sceneNodes=NODES.filter(n=>ids.has(n.id)); sceneHops=[];
  const c=CH[S.ch];
  if(c.flow){ c.flow.forEach((h,i)=>{ let bend=bendFor(h[0],h[1]); const rev=c.flow.findIndex(x=>x[0]===h[1]&&x[1]===h[0]); if(rev>-1&&rev<i) bend=bend==='xy'?'yx':'xy'; sceneHops.push({flow:'ch',idx:i,from:h[0],to:h[1],label:h[2],payload:h[3],bend}); }); }
  else { FLOWS.forEach(f=>{ if(S.flowSel!=='both'&&f.id!==S.flowSel)return; f.hops.forEach((h,i)=>sceneHops.push({flow:f.id,idx:i,from:h[0],to:h[1],label:h[2],payload:h[3],bend:h[4]||'xy'})); }); }
}
function bendFor(a,b){ const t=FLOWS[0].hops.find(h=>h[0]===a&&h[1]===b)||FLOWS[1].hops.find(h=>h[0]===a&&h[1]===b); return t?(t[4]||'xy'):'yx'; }
function buildInsideScene(n){
  const steps=n.steps||[]; sceneNodes=steps.map((s,i)=>({id:'s'+i,code:String(i+1),name:s[0],short:s[0],desc:s[1],gx:2+i*3.4,gy:2+i*0.6,w:2,d:2,h:34,inside:true}));
  sceneHops=[]; for(let i=0;i<steps.length-1;i++) sceneHops.push({flow:'inside',idx:i,from:'s'+i,to:'s'+(i+1),label:steps[i][0]+' → '+steps[i+1][0],payload:{step:i+1,handsOff:steps[i+1][0]},bend:'xy'});
}
function hopPath(h){
  const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); if(!A||!B) return null;
  const [ax,ay]=center(A), [bx,by]=center(B); const mid = h.bend==='xy' ? [bx,ay] : [ax,by];
  const g=[[ax,ay],mid,[bx,by]].filter((p,i,arr)=>i===0||p[0]!==arr[i-1][0]||p[1]!==arr[i-1][1]);
  const scr=g.map(p=>P(p[0],p[1],0)); let len=0; const seg=[]; for(let i=1;i<scr.length;i++){const l=Math.hypot(scr[i][0]-scr[i-1][0],scr[i][1]-scr[i-1][1]);seg.push(l);len+=l;}
  return {grid:g,scr,seg,len};
}
function pointAt(path,t){ let d=t*path.len; for(let i=0;i<path.seg.length;i++){ if(d<=path.seg[i]||i===path.seg.length-1){const u=path.seg[i]?Math.min(1,d/path.seg[i]):1;const a=path.scr[i],b=path.scr[i+1];return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];} d-=path.seg[i]; } return path.scr[0]; }

/* ---------------- RENDER ---------------- */
function render(){
  world.innerHTML='';
  const gg=el('g',{opacity:.55}); const R=[-4,26];
  for(let i=R[0];i<=R[1];i+=2){ const a=P(i,R[0]),b=P(i,R[1]);gg.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--grid)','stroke-width':.6})); const c=P(R[0],i),d=P(R[1],i);gg.appendChild(el('line',{x1:c[0],y1:c[1],x2:d[0],y2:d[1],stroke:'var(--grid)','stroke-width':.6})); }
  world.appendChild(gg);
  if(S.view==='world'&&S.ch>=CH.length-1){
    const plate=(x0,y0,x1,y1,dash)=>{const p=el('polygon',{points:pts([P(x0,y0),P(x1,y0),P(x1,y1),P(x0,y1)]),fill:'none',stroke:'var(--ink)','stroke-width':.9,opacity:.5});if(dash)p.setAttribute('stroke-dasharray','5 4');return p;};
    world.appendChild(plate(0.5,1.5,17,10.5,false)); world.appendChild(plate(2,9,17.5,16.5,false)); world.appendChild(plate(-2,-2,24,17.5,true));
  }
  const hg=el('g'); world.appendChild(hg);
  sceneHops.forEach(h=>{ h.path=hopPath(h); if(!h.path)return; const ghost=byId[h.from]?.ghost||byId[h.to]?.ghost;
    const pl=el('polyline',{points:pts(h.path.scr),fill:'none',stroke:'var(--ink)','stroke-width':h.flow!=='turn'&&h.flow!=='ch'&&h.flow!=='inside'?1:1.4,opacity:(h.flow!=='turn'&&h.flow!=='ch'&&h.flow!=='inside')||ghost?.7:1});
    if((h.flow!=='turn'&&h.flow!=='ch'&&h.flow!=='inside')||ghost)pl.setAttribute('stroke-dasharray','3 3'); hg.appendChild(pl);
    h.path.scr.slice(1,-1).forEach(p=>hg.appendChild(el('polygon',{points:pts([[p[0],p[1]-3.5],[p[0]+3.5,p[1]],[p[0],p[1]+3.5],[p[0]-3.5,p[1]]]),fill:'var(--ink)'})));
  });
  const ng=el('g'); world.appendChild(ng);
  [...sceneNodes].sort((a,b)=>(a.gx+a.gy+a.w+a.d)-(b.gx+b.gy+b.w+b.d)).forEach(n=>ng.appendChild(drawNode(n)));
  const lg=el('g'); world.appendChild(lg); sceneNodes.forEach(n=>lg.appendChild(drawLabel(n)));
  world.appendChild(el('g',{id:'pkts'})); drawPackets(); renderRail();
}
function drawLabel(n){
  const g=el('g',{style:'pointer-events:none'});
  const b=P(n.gx+n.w, n.gy+n.d, 0); const txt=(n.short||n.name).toUpperCase(); const w=txt.length*6.6+10; const y=b[1]+9;
  const dim=n.ghost&&!n.inside;
  g.appendChild(el('rect',{x:b[0]-w/2,y:y,width:w,height:14,fill:S.selected===n.id?'var(--hi-bg)':'var(--paper)',stroke:dim?'var(--ghost)':'var(--ink)','stroke-width':.9,'stroke-dasharray':dim?'3 2':'none'}));
  const t=el('text',{x:b[0],y:y+10.5,'text-anchor':'middle','font-size':'9','font-family':'var(--mono)','letter-spacing':'.06em',fill:S.selected===n.id?'var(--hi-fg)':(dim?'var(--ink-2)':'var(--ink)'),'font-weight':'500'}); t.textContent=txt; g.appendChild(t);
  return g;
}
function drawNode(n){
  const g=el('g',{class:'node',style:'cursor:pointer','data-id':n.id});
  const {gx,gy,w,d,h}=n; const sel=S.selected===n.id, hov=S.hover===n.id, fresh=!n.inside&&isNew(n.id);
  const sw=sel?2:1.2, dash=n.ghost?'4 3':null, face=n.ghost?'none':'var(--face)';
  const face3=(p,fill,hatch,extra={})=>{const poly=el('polygon',{points:pts(p),fill:fill,stroke:'var(--ink)','stroke-width':sw,'stroke-linejoin':'round',...extra});if(dash)poly.setAttribute('stroke-dasharray',dash);g.appendChild(poly);if(hatch&&!n.ghost){g.appendChild(el('polygon',{points:pts(p),fill:'url(#'+hatch+')',style:'color:var(--ink)',stroke:'none'}));}};
  const box=(z0,z1,hatchTop)=>{ face3([P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,'hatch'); face3([P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)],face,'hatch'); face3([P(gx,gy,z1),P(gx+w,gy,z1),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,hatchTop||null); };
  const kind=n.kind||'box';
  if(kind==='store'){ const L=3, gap=3, lh=(h-gap*(L-1))/L; for(let i=0;i<L;i++){ const z0=i*(lh+gap); box(z0,z0+lh,null);} }
  else if(kind==='cards'){ const L=5, lh=h/L; for(let i=0;i<L;i++) box(i*lh,(i+1)*lh,null); }
  else if(kind==='slab'){ box(0,h,'hatchLight'); }
  else if(kind==='screen'){ box(0,h,null); const inset=.3; if(!n.ghost){ const scr=[P(gx+inset,gy+inset,h),P(gx+w-inset,gy+inset,h),P(gx+w-inset,gy+d-inset,h),P(gx+inset,gy+d-inset,h)]; g.appendChild(el('polygon',{points:pts(scr),fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.9})); for(let i=1;i<=3;i++){const a=P(gx+inset+.2,gy+inset+i*.4,h),b=P(gx+w-inset-.4-(i===3?.5:0),gy+inset+i*.4,h);g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.7}));} } }
  else if(kind==='gate'){ box(0,h,null); if(!n.ghost){ const z0=h*.55,z1=h*.75; const band=[[P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],[P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)]]; band.forEach(p=>g.appendChild(el('polygon',{points:pts(p),fill:'var(--ink)',opacity:.85,stroke:'none'}))); } }
  else if(kind==='tall'){ box(0,h,null); if(!n.ghost){ // roof ridge line on top to read as "the brain"
      const c=P(gx+w/2,gy+d/2,h); const a=P(gx,gy+d,h),b=P(gx+w,gy,h); g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.5})); } }
  else if(kind==='job'){ box(0,h,'hatchLight'); }
  else { box(0,h,null); }
  const top=[P(gx,gy,h),P(gx+w,gy,h),P(gx+w,gy+d,h),P(gx,gy+d,h)];
  if(sel||hov){ g.appendChild(el('polygon',{points:pts(top),fill:sel?'var(--ink)':'none',opacity:sel?.12:1,stroke:'var(--ink)','stroke-width':sel?2.5:1.8})); }
  if(fresh&&!sel){ g.appendChild(el('polygon',{class:'halo',points:pts([P(gx-.35,gy-.35,0),P(gx+w+.35,gy-.35,0),P(gx+w+.35,gy+d+.35,0),P(gx-.35,gy+d+.35,0)]),fill:'none',stroke:'var(--ink)','stroke-width':1.4,'stroke-dasharray':'4 3'})); }
  const c=P(gx+w/2,gy+d/2,h); const chipW=16;
  g.appendChild(el('rect',{x:c[0]-chipW/2,y:c[1]-8,width:chipW,height:14,fill:sel?'var(--hi-bg)':'var(--paper)',stroke:'var(--ink)','stroke-width':1}));
  const t=el('text',{x:c[0],y:c[1]+3,'text-anchor':'middle','font-size':'9','font-family':'var(--mono)',fill:sel?'var(--hi-fg)':'var(--ink)','font-weight':'600'}); t.textContent=n.code; g.appendChild(t);
  g.addEventListener('mouseenter',e=>{S.hover=n.id;showTip(e,n);renderPanel();render();});
  g.addEventListener('mousemove',e=>moveTip(e));
  g.addEventListener('mouseleave',()=>{S.hover=null;hideTip();renderPanel();render();});
  g.addEventListener('click',e=>{e.stopPropagation();select(n.id);});
  g.addEventListener('dblclick',e=>{e.stopPropagation();if(!n.inside)goInside(n.id);});
  return g;
}

/* ---------------- PACKETS ---------------- */
function initPackets(){ S.packets=[]; const flows=[...new Set(sceneHops.map(h=>h.flow))]; flows.forEach(f=>S.packets.push({flow:f,hop:0,t:0,speed:.5,pause:0})); S.selPacket=null; }
function hopsOf(flow){ return sceneHops.filter(h=>h.flow===flow); }
function drawPackets(){
  const pg=world.querySelector('#pkts'); if(!pg)return; pg.innerHTML='';
  S.packets.forEach((p,i)=>{ const hs=hopsOf(p.flow); const h=hs[p.hop]; if(!h||!h.path)return; const [x,y]=pointAt(h.path,p.t);
    const isSel=S.selPacket===i; const g=el('g',{class:'pkt',style:'cursor:pointer'});
    if(isSel) g.appendChild(el('circle',{cx:x,cy:y,r:11,fill:'none',stroke:'var(--ink)','stroke-width':1.2,'stroke-dasharray':'2 2'}));
    g.appendChild(el('circle',{cx:x,cy:y,r:5.5,fill:'var(--ink)',stroke:'var(--paper)','stroke-width':1.6}));
    if(isSel||S.hoverPacket===i||S.ch<CH.length-1){ const lbl=el('text',{x:x+10,y:y-8,'font-size':'10','font-family':'var(--mono)',fill:'var(--ink)','font-weight':'500'}); lbl.textContent=h.label; g.appendChild(el('rect',{x:x+7,y:y-19,width:h.label.length*6.4+6,height:14,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.8})); g.appendChild(lbl); }
    g.addEventListener('click',e=>{e.stopPropagation();S.selPacket=i;S.playing=false;syncFlowBtn();renderPanel();drawPackets();});
    g.addEventListener('mouseenter',()=>{S.hoverPacket=i;drawPackets();});
    g.addEventListener('mouseleave',()=>{S.hoverPacket=null;drawPackets();});
    pg.appendChild(g);
  });
}
let last=0;
function tick(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; tweenTick(); if(S.playing){ S.packets.forEach(p=>advance(p,dt)); drawPackets(); if(S.selPacket!=null) renderPanel(); } requestAnimationFrame(tick); }
function advance(p,dt){ const hs=hopsOf(p.flow); if(!hs.length)return; if(p.pause>0){p.pause-=dt;return;} const h=hs[p.hop]; if(!h||!h.path){p.hop=(p.hop+1)%hs.length;return;} p.t+=dt*p.speed*(320/Math.max(120,h.path.len)); if(p.t>=1){p.t=0;p.hop=(p.hop+1)%hs.length;p.pause=(p.hop===0?1.2:.35);} }
function stepOnce(){ S.playing=false; syncFlowBtn(); let i=S.selPacket??0; const p=S.packets[i]; if(!p)return; const hs=hopsOf(p.flow); p.hop=(p.hop+1)%hs.length; p.t=.5; p.pause=0; S.selPacket=i; drawPackets(); renderPanel(); }
function syncFlowBtn(){ document.getElementById('btnFlow').textContent = S.playing?'‖ Pause':'▸ Play'; }
requestAnimationFrame(tick);

/* ---------------- PANEL ---------------- */
function nodeChip(id){ const n=byId[id]; return `<button class="chip${n.ghost?' ghost':''}" onclick="select('${id}')">${esc(n.code)} · ${esc(n.name)}</button>`; }
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(S.selPacket!=null && S.packets[S.selPacket]){ const p=S.packets[S.selPacket]; const hs=hopsOf(p.flow); const h=hs[p.hop];
    const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); const flowName=p.flow==='ch'?CH[S.ch].title:p.flow==='inside'?'inside '+byId[S.inside].name:(FLOWS.find(f=>f.id===p.flow)||{}).name;
    body.innerHTML=`<div class="eyebrow">Data packet · ${esc(flowName)} · hop ${p.hop+1} of ${hs.length}</div><h1 class="t">${esc(h.label)}</h1>
    <div class="pk"><div class="lbl">Route</div><div class="route">${esc(A.code)} ${esc(A.name)} &nbsp;→&nbsp; ${esc(B.code)} ${esc(B.name)}</div><div class="lbl">Payload (representative)</div><pre>${esc(JSON.stringify(h.payload,null,2))}</pre></div>
    <p>Payload shapes are what the design implies, not measured traffic.</p>
    <div class="actions"><button class="ctl" onclick="stepOnce()">Trace one step</button><button class="ctl" onclick="S.selPacket=null;S.playing=true;syncFlowBtn();renderPanel();drawPackets()">Release & play</button><button class="ctl" onclick="select('${esc(B.id)}')">Open ${esc(B.code)}</button></div>`; return; }
  const id=S.selected??S.hover; const n=id?sceneNodes.find(x=>x.id===id):null;
  if(!n){ renderChapterPanel(); return; }
  if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
    body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
    <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
    <div class="actions"><button class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
  const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${n.group==='loop'?'turn loop':n.group==='mem'?'memory':'supporting'}</span>`;
  const pinned=S.selected===n.id;
  let content='';
  if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
